<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Mot de passe oublié</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-sm w-full bg-white rounded-lg shadow p-6">
      <h1 class="text-2xl font-bold text-gray-800 mb-4">Mot de passe oublié</h1>

      {% if sent %}
      <p class="text-sm text-gray-600">
        Si un compte existe avec cet email, un lien de réinitialisation vient
        d'être envoyé.
      </p>
      {% else %}
      <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Email</label
          >
          <input
            type="email"
            name="email"
            required
            class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-700"
        >
          Envoyer le lien
        </button>
      </form>
      {% endif %}

      <p class="mt-4 text-sm text-gray-500">
        <a href="{% url 'login' %}" class="text-blue-600 hover:underline"
          >Retour à la connexion</a
        >
      </p>
    </div>
  </body>
</html>
