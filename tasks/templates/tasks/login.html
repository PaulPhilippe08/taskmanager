<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-sm w-full bg-white rounded-lg shadow p-6">
      <h1 class="text-2xl font-bold text-gray-800 mb-4">Connexion</h1>

      {% if error %}
      <p class="text-red-600 text-sm mb-4">{{ error }}</p>
      {% endif %}

      <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Nom d'utilisateur</label
          >
          <input
            type="text"
            name="username"
            required
            class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Mot de passe</label
          >
          <input
            type="password"
            name="password"
            required
            class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
          />
        </div>
        <p class="text-right text-sm">
          <a
            href="{% url 'forgot_password' %}"
            class="text-blue-600 hover:underline"
            >Mot de passe oublié ?</a
          >
        </p>
        <button
          type="submit"
          class="w-full bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-blue-700"
        >
          Se connecter
        </button>
      </form>

      <p class="mt-4 text-sm text-gray-500">
        Pas de compte ?
        <a href="{% url 'register' %}" class="text-blue-600 hover:underline"
          >S'inscrire</a
        >
      </p>
    </div>
  </body>
</html>
